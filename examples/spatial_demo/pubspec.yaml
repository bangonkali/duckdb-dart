name: spatial_demo
description: "A spatial demo for DuckDB Dart."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Local dependency
  dart_duckdb:
    path: ../../
    
  # Map support
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  
  # File/Path utilities
  path_provider: ^2.1.5
  path: ^1.9.0
  
  # Settings/Storage
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
